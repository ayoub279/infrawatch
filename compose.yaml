name: infrawatch
x-app: &app
  image: infrawatch-api:${RELEASE:-local}
  build:
    context: .
    dockerfile: deploy/api.Dockerfile
  env_file: .env
  restart: unless-stopped
  init: true
  user: www-data
  read_only: true
  tmpfs:
    - /tmp
    - /app/storage:uid=82,gid=82,mode=0770
    - /app/bootstrap/cache:uid=82,gid=82,mode=0770
  cap_drop: [ALL]
  pids_limit: 64
  mem_limit: 512m
  cpus: 1.0
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Run scripts/init.sh}
      POSTGRES_USER: ${DB_USERNAME:?Run scripts/init.sh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/init.sh}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    <<: *app
    command: [php, artisan, migrate, --force]
    restart: "no"
    networks: [data]
    depends_on: {db: {condition: service_healthy}}
    healthcheck: {disable: true}

  api:
    <<: *app
    networks: [edge, data]
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD-SHELL, /app/deploy/api-health.sh]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *app
    command: [php, artisan, schedule:work, --no-interaction]
    networks: [data, outbound]
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD, php, artisan, monitor:health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  proxy:
    image: infrawatch-proxy:${RELEASE:-local}
    build:
      context: .
      dockerfile: deploy/proxy.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes: [caddy_data:/data, caddy_config:/config]
    networks: [edge, outbound]
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
networks:
  edge: {internal: true}
  data: {internal: true}
  outbound:
